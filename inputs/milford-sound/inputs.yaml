# What to put in this file. Empty means the report says not provided.
# This example uses the public Milford Sound collection fetched on 2026-11-26.
# EOS links are blank on purpose: we do not have a signed-in EOS session.
ce_name: "Milford Sound cruises"
ce_id: "3945"  # numeric Headout collection / CE id, if you know it

# Browser URL of the MMP draft, like https://eos.headout.com/mmp/draft/<id>/.... Leave blank if you cannot open EOS.
eos_mmp_link: ""

# Browser URL of the proposed-assortment screen for this CE. Leave blank to skip.
eos_assortment_link: ""

# Browser URL of the locked content screen. Leave blank to skip.
eos_content_link: ""

# Files you saved from EOS (HTML, JSON, or CSV). Paths are relative to this folder, usually exports/page.html.
eos_exports: []

# PNG or JPG of the assortment or content page. Paths relative to this folder, usually screenshots/assortment.png.
screenshots: []

# Attraction site if one exists (the standalone domain). Leave blank if you do not have one.
# No Headout Milford Sound microbrand was found on 2026-11-26.
microbrand_url: ""

# GetYourGuide, Viator, or the operator's own page. One URL per line.
competitor_urls:
  - "https://www.realnz.com/en/blog/milford-sound-cruise-comparison/"
  - "https://milfordsoundtravel.com/things-to-do-in-milford-sound/best-milford-sound-cruises/"
  - "https://www.viator.com/Fiordland-and-Milford-Sound-tours/Cruises-Sailing-and-Water-Tours/d756-g3"

# Links to the MMP or go-live thread. The tool lists them. It does not post.
slack_threads: []

# Anything the page does not say: price caveats, season, who to ask.
notes: "Public headout.com collection c-3945, fetched 2026-11-26. Optional-lunch card showed NZ$143.20 while the product page showed NZ$155. No EOS draft was available, so those links are blank."
