  hero_title: Experience the best cruises in Milford Sound
  hero_copy: >
    Get spectacular views and breathtaking panoramas of the Tasman Sea and the
    Mitre Peak at Milford Sound. Sail along the 16km fiord, and marvel at the
    beauty of St Annes Point Lighthouse. Get informational commentary onboard
    and learn about Lion Mountain, Copper Point, Seal Rock and Stirling Falls
    as you pass them by.
  usps:
    - "Collection rating 4.8/5 from 6,363 travellers"
    - "Long-form compare block: standard scenic, nature and wildlife, overnight, and underwater observatory"
    - "Morning, afternoon, and late-day cruise guidance on the same page"
    - "Boarding point spelled out: Milford Sound Visitor Centre and Cruise Terminal, SH94"
  faqs:
    - question: How long does the Milford Sound cruise part of the tour take?
      answer: >
        The on-water section is usually 1.5–2 hours for a standard scenic or
        nature cruise. Full-day coach-and-cruise packages from Queenstown or
        Te Anau take most of the day door-to-door.
    - question: What's included in a typical Milford Sound sightseeing cruise ticket?
      answer: >
        A standard cruise includes the boat trip, indoor lounges and outdoor
        decks, and live or audio commentary. Some packages add tea and coffee,
        lunch, or coach transfers. Check the specific ticket.
    - question: How do I get to the departure point, and is parking available?
      answer: >
        Cruises depart from the Milford Sound Visitor Centre/terminal via SH94,
        coach from Queenstown or Te Anau, or a bundled tour. A car park is about
        300 meters away.
    - question: Do I need to book in advance, and can I change it later?
      answer: >
        Advance booking is strongly recommended, especially November–April.
        Most tickets allow changes or cancellations up to a cutoff. Check the
        product terms.
    - question: What happens if the weather is bad?
      answer: >
        Cruises usually operate in rain. Severe conditions may delay or cancel
        a sailing, with rebooking or a refund according to policy.
    - question: Are cruises accessible for wheelchair users or people with limited mobility?
      answer: >
        Many vessels offer step-free or ramped boarding and accessible main
        decks. Upper outdoor decks may require stairs. Mention access needs
        when booking.
    - question: Can I bring a stroller or young children?
      answer: >
        Yes. Strollers are generally allowed but may need to be folded. Children
        must be supervised on open decks.
    - question: Is the cruise suitable for older travellers?
      answer: >
        The cruise itself is mostly boarding and moving between decks, with
        indoor and outdoor seating.
  trust_signals:
    - "4.8/5 from 6,363 travellers on the collection"
    - "Product pages show 100% ticket guarantee, 100% experience guarantee, and 100% assistance guarantee"
    - "Free cancellation up to 24 hours is stated on the cruise and day-trip products that were opened"
