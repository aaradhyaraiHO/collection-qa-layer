  faqs:
    - question: What are Masai Mara safaris like?
      answer: >
        They typically combine game drives, accommodation, and meals, with road
        and fly-in options, shared or private vehicles, and multi-park combinations.
    - question: How many days do I need?
      answer: >
        A 2-day safari can work for a short trip. Three days gives more game-drive
        time. Four days or longer is a slower pace.
    - question: When is the best time?
      answer: >
        July to October is the main migration season. River crossings are most
        likely from July to September and are not guaranteed.
    - question: Should I choose a road or fly-in safari?
      answer: >
        Road safaris suit a lower budget or a multi-park route. Fly-in safaris
        save the 5–6 hour drive.
    - question: Are safaris suitable for families?
      answer: >
        Many camps welcome families, but age rules vary. Private safaris give
        families more control of the day.
    - question: Are wildlife sightings guaranteed?
      answer: No. Longer stays give more chances.
    - question: Can I combine the Mara with other parks?
      answer: >
        Yes. Itineraries add Lake Nakuru, Lake Naivasha, or Amboseli. Road
        safaris fit multi-park routes.
    - question: What is included?
      answer: >
        Inclusions vary. Packages may include accommodation, meals, game drives,
        transfers, flights, a guide, and park fees. Check each safari, especially
        park fees, transfers, and flights.
