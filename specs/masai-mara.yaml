    heading: Road
    body: 'Travel from Nairobi by safari vehicle or transfer. The journey takes around 5–6 hours and can
      include a Rift Valley stop or scenic detour. Best for: lower-cost trips, longer itineraries, and
      multi-park circuits.'
  - id: fly_in
    heading: Fly-in
    body: 'Fly from Nairobi''s Wilson Airport to an airstrip in the Mara. The flight takes about 45 minutes,
      followed by a transfer to your camp or lodge. Best for: short trips when you want to spend more
      of your time on safari.'
  - id: shared
