  faqs:
  - q: What are Masai Mara safaris like?
    a: Masai Mara safaris typically combine game drives, accommodation and meals, with road and fly-in
      options available. Depending on the itinerary, you can choose between shared or private vehicles,
      different accommodation tiers and multi-park combinations.
  - q: How many days do I need for a Masai Mara safari?
    a: A 2-day safari can work for a short trip, but 3 days gives you more time for game drives. A 4-day
      or longer safari allows for a slower pace and more wildlife-viewing opportunities.
  - q: When is the best time for Masai Mara safaris?
    a: July to October is the main migration season, with river crossings most likely from July to September.
      December to February is generally drier, while March to May tends to be wetter. Wildlife can be
      seen year-round, but conditions and sightings vary.
  - q: Should I choose a road or fly-in Masai Mara safari?
    a: Road safaris can suit travellers looking for a lower-cost option or those combining the Mara with
      other destinations along the route. Fly-in safaris can save travel time and work well for shorter
      trips.
  - q: Are Masai Mara safaris suitable for families?
    a: Many camps and lodges welcome families, but age restrictions vary by property and activity. Private
      safaris can also give families more flexibility with vehicle use and daily schedules.
  - q: Are wildlife sightings guaranteed on Masai Mara safaris?
    a: No. Wildlife is wild, so no safari can guarantee a particular animal, migration crossing or other
      sighting. Longer stays give you more opportunities to explore different areas and look for wildlife.
  - q: Can I combine Masai Mara safaris with other parks?
    a: Yes. Depending on the itinerary, you can combine the Mara with **Lake Nakuru, Lake Naivasha or
      Amboseli**. Road safaris are particularly suited to multi-park itineraries, while selected fly-in
      routes can also connect the Mara with other safari destinations.
  - q: What is included in Masai Mara safari packages?
    a: Inclusions vary by safari, but packages may include accommodation, meals, game drives, transfers,
      flights, a professional guide and park fees. Check each safari's inclusions before booking, especially
      for park fees, transfers and flights.
  sections:
