[project]
name = "collection-qa"
version = "0.1.0"
description = "Pre-launch collection QA for Headout using Semantic Similarity Rating"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "anthropic>=0.40",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
eos = ["playwright>=1.40"]
dev = ["pytest>=8.0"]

[project.scripts]
collection-qa = "collection_qa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
